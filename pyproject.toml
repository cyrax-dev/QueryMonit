[project]
name = "querymonit"
version = "2.0.0"
description = "Run multiple Discord bots from a single application to monitor DayZ servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "disnake>=2.11.0",
    "python-a2s>=1.4.1",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "cx-freeze>=8.5.3",
]

[tool.cxfreeze]
executables = [
    { script = "src/main.py", base = "console", target_name = "QueryMonit.exe", icon = "assets/querymonit.ico" }
]

[tool.cxfreeze.build_exe]
include_path = ["src"]
include_files = ["servers.json"]

zip_include_packages = ["*"]
zip_exclude_packages = []

optimize = 2
include_msvcr = false
